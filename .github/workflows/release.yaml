name: Release

on:
  push:
    tags:
      - "v*"

permissions: read-all

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: release

    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -race -timeout 120s ./...

      - name: Verify release tag and nested module tags
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]

          # A release tag may only target reviewed code already present on
          # the protected default branch, and GitHub must recognize the
          # commit signature as verified.
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" \
            --jq '.commit.verification.verified')" = true

          version="${GITHUB_REF_NAME#v}"
          for manifest in loader/cloud/go.mod secret/cloud/go.mod examples/cloud/go.mod; do
            awk -v version="v${version}" \
              '$1 == "github.com/confiify/confii-go" && $2 == version { found = 1 } END { exit !found }' \
              "$manifest"
          done
          for tag in "loader/cloud/$GITHUB_REF_NAME" "secret/cloud/$GITHUB_REF_NAME"; do
            test "$(git rev-list -n 1 "$tag")" = "$GITHUB_SHA"
          done

      - name: Verify all module manifests
        run: sh scripts/verify-modules.sh

      - name: Verify cloud provider packages as a consumer
        run: sh scripts/test-cloud-consumer.sh 'aws,azure,gcp,vault,ibm' test

      - name: Build and stage draft GitHub release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Attest release artifacts
        id: attest
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-checksums: dist/checksums.txt

      - name: Attach provenance and publish release
        shell: bash
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          provenance="confii-${GITHUB_REF_NAME}.intoto.jsonl"
          cp "$ATTESTATION_BUNDLE" "$provenance"
          gh release upload "$GITHUB_REF_NAME" "$provenance" --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
