name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: js
            goarch: wasm
          - goos: linux
            goarch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            loader/cloud/go.sum
            secret/cloud/go.sum
            examples/cloud/go.sum

      - name: Build (core)
        run: go build ./...
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}

      - name: Build CLI
        run: go build -o /dev/null ./confii
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'

  test:
    name: Test
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.25", "1.26"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ matrix.go }}

      - name: Test (with race detector)
        run: go test -race -v -shuffle=on -timeout 120s ./...
        if: runner.os != 'Windows'

      - name: Test (without race detector)
        run: go test -v -shuffle=on -timeout 120s ./...
        if: runner.os == 'Windows'

  test-cloud-tags:
    name: Test (cloud tags)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        tags:
          - aws
          - azure
          - gcp
          - vault
          - ibm
          - "aws,azure,gcp,vault,ibm"

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Build as a cloud consumer
        run: sh scripts/test-cloud-consumer.sh '${{ matrix.tags }}' build

      - name: Test as a cloud consumer
        run: sh scripts/test-cloud-consumer.sh '${{ matrix.tags }}' test

  test-integration:
    name: Integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Integration tests
        run: go test -v -count=1 -timeout 120s ./integration/...

  fuzz:
    name: Fuzz (short)
    runs-on: ubuntu-latest

    # Runs each known fuzz target with a short fuzztime so PR feedback
    # stays fast. Longer fuzz campaigns can be scheduled in a separate
    # workflow that runs nightly. The matrix lists each fuzz target as
    # `<package>:<func>` so a failure points clearly at the offending
    # target. -run=^$ disables the seed-only unit tests for that
    # invocation; the seed corpus is still exercised because Go's fuzz
    # engine prepends f.Add seeds to the queue.
    # NOTE: -fuzz only accepts a single Go package, so each entry below
    # is the precise package path (no /...) for one fuzz target.
    strategy:
      fail-fast: false
      matrix:
        target:
          - "./loader:FuzzYAMLLoader"
          - "./loader:FuzzJSONLoader"
          - "./loader:FuzzTOMLLoader"
          - "./loader:FuzzEnvFileLoader"
          - "./loader:FuzzUnquoteEnvValue"
          - "./secret:FuzzResolverResolve"
          - "./internal/dictutil:FuzzGetNested"
          - "./internal/dictutil:FuzzSetNested"
          - "./internal/dictutil:FuzzDeepMerge"

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Fuzz target
        run: |
          target='${{ matrix.target }}'
          pkg="${target%%:*}"
          fn="${target##*:}"
          echo "Fuzzing $fn in $pkg for 30s"
          go test -run='^$' -fuzz="^${fn}$" -fuzztime=30s -timeout=120s "$pkg"

  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Run tests with coverage
        run: go test -coverprofile=coverage.out -covermode=atomic -timeout 120s ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: test -z "$(gofmt -s -l .)" || { gofmt -s -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Vet cloud packages as a consumer
        run: sh scripts/test-cloud-consumer.sh 'aws,azure,gcp,vault,ibm' vet

      - name: Lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          version: v2.11.4

  module-integrity:
    name: Module integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Verify all module manifests
        run: sh scripts/verify-modules.sh

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Install Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: Scan release tree
        run: gitleaks dir . --redact --no-banner --exit-code 1
