name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: js
            goarch: wasm
          - goos: linux
            goarch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            loader/cloud/go.sum
            secret/cloud/go.sum
            examples/cloud/go.sum

      - name: Build (core)
        run: go build ./...
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}

      - name: Build CLI
        run: go build -o /dev/null ./confii
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'

  test:
    name: Test
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.25", "1.26"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}

      - name: Test (with race detector)
        run: go test -race -v -shuffle=on -timeout 120s ./...
        if: runner.os != 'Windows'

      - name: Test (without race detector)
        run: go test -v -shuffle=on -timeout 120s ./...
        if: runner.os == 'Windows'

  test-cloud-tags:
    name: Test (cloud tags)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        tags:
          - aws
          - azure
          - gcp
          - vault
          - ibm
          - "aws,azure,gcp,vault,ibm"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build as a cloud consumer
        run: sh scripts/test-cloud-consumer.sh '${{ matrix.tags }}' build

      - name: Test as a cloud consumer
        run: sh scripts/test-cloud-consumer.sh '${{ matrix.tags }}' test

  test-integration:
    name: Integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Integration tests
        run: go test -v -count=1 -timeout 120s ./integration/...

  fuzz:
    name: Fuzz (short)
    runs-on: ubuntu-latest

    # Runs each known fuzz target with a short fuzztime so PR feedback
    # stays fast. Longer fuzz campaigns can be scheduled in a separate
    # workflow that runs nightly. The matrix lists each fuzz target as
    # `<package>:<func>` so a failure points clearly at the offending
    # target. -run=^$ disables the seed-only unit tests for that
    # invocation; the seed corpus is still exercised because Go's fuzz
    # engine prepends f.Add seeds to the queue.
    # NOTE: -fuzz only accepts a single Go package, so each entry below
    # is the precise package path (no /...) for one fuzz target.
    strategy:
      fail-fast: false
      matrix:
        target:
          - "./loader:FuzzYAMLLoader"
          - "./loader:FuzzJSONLoader"
          - "./loader:FuzzTOMLLoader"
          - "./loader:FuzzEnvFileLoader"
          - "./loader:FuzzUnquoteEnvValue"
          - "./secret:FuzzResolverResolve"
          - "./internal/dictutil:FuzzGetNested"
          - "./internal/dictutil:FuzzSetNested"
          - "./internal/dictutil:FuzzDeepMerge"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Fuzz target
        run: |
          target='${{ matrix.target }}'
          pkg="${target%%:*}"
          fn="${target##*:}"
          echo "Fuzzing $fn in $pkg for 30s"
          go test -run='^$' -fuzz="^${fn}$" -fuzztime=30s -timeout=120s "$pkg"

  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run tests with coverage
        run: go test -coverprofile=coverage.out -covermode=atomic -timeout 120s ./...

      - name: Enforce 90% non-example statement coverage
        run: sh scripts/check-statement-coverage.sh coverage.out

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: test -z "$(gofmt -s -l .)" || { gofmt -s -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Vet cloud packages as a consumer
        run: sh scripts/test-cloud-consumer.sh 'aws,azure,gcp,vault,ibm' vet

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.4

  module-integrity:
    name: Module integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Verify all module manifests
        run: sh scripts/verify-modules.sh

  reproducible-build:
    name: Reproducible build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Verify reproducible CLI build
        run: sh scripts/check-reproducible-build.sh

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: Scan release tree
        run: gitleaks dir . --redact --no-banner --exit-code 1

  required:
    name: CI required
    if: always()
    needs:
      - build
      - test
      - test-cloud-tags
      - test-integration
      - fuzz
      - coverage
      - lint
      - module-integrity
      - reproducible-build
      - dependency-review
      - secret-scan
    runs-on: ubuntu-latest

    steps:
      - name: Verify required jobs
        shell: bash
        run: |
          set -euo pipefail
          test '${{ needs.build.result }}' = success
          test '${{ needs.test.result }}' = success
          test '${{ needs.test-cloud-tags.result }}' = success
          test '${{ needs.test-integration.result }}' = success
          test '${{ needs.fuzz.result }}' = success
          test '${{ needs.coverage.result }}' = success
          test '${{ needs.lint.result }}' = success
          test '${{ needs.module-integrity.result }}' = success
          test '${{ needs.reproducible-build.result }}' = success
          test '${{ needs.secret-scan.result }}' = success

          # Dependency review runs on pull requests and is intentionally
          # skipped on the post-merge push to main.
          case '${{ needs.dependency-review.result }}' in
            success|skipped) ;;
            *) exit 1 ;;
          esac
