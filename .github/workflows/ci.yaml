name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: js
            goarch: wasm
          - goos: linux
            goarch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            loader/cloud/go.sum
            secret/cloud/go.sum
            examples/cloud/go.sum

      - name: Build (core)
        run: go build ./...
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}

      - name: Build CLI
        run: go build -o /dev/null ./confii
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'

  test:
    name: Test
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.25", "1.26"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}

      - name: Test (with race detector)
        run: go test -race -v -shuffle=on -timeout 120s ./...
        if: runner.os != 'Windows'

      - name: Test (without race detector)
        run: go test -v -shuffle=on -timeout 120s ./...
        if: runner.os == 'Windows'

  test-cloud-tags:
    name: Test (cloud tags)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        tags:
          - aws
          - azure
          - gcp
          - vault
          - ibm
          - "aws,azure,gcp,vault,ibm"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build as a cloud consumer
        run: sh scripts/test-cloud-consumer.sh '${{ matrix.tags }}' build

      - name: Test as a cloud consumer
        run: sh scripts/test-cloud-consumer.sh '${{ matrix.tags }}' test

  openbao-interop:
    name: OpenBao interoperability
    runs-on: ubuntu-latest

    services:
      openbao:
        image: ghcr.io/openbao/openbao:2.6.1@sha256:5b2486ab0fb90bbc788cc345b0a08616dfb375873ee8be5df3a2fd4d378a67e0
        env:
          BAO_DEV_ROOT_TOKEN_ID: confii-openbao-ci-root
        ports:
          - 8200:8200

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Configure ephemeral OpenBao AppRole
        shell: bash
        env:
          OPENBAO_ADDR: http://127.0.0.1:8200
          OPENBAO_TOKEN: confii-openbao-ci-root
        run: |
          set -euo pipefail

          for attempt in {1..30}; do
            if curl --fail --silent --show-error "$OPENBAO_ADDR/v1/sys/health" >/dev/null; then
              break
            fi
            if (( attempt == 30 )); then
              echo "::error::OpenBao did not become ready"
              exit 1
            fi
            sleep 1
          done

          call_bao() {
            curl --fail --silent --show-error \
              --header "X-Vault-Token: $OPENBAO_TOKEN" \
              --header 'Content-Type: application/json' "$@"
          }

          call_bao --request POST --data '{"type":"approle"}' \
            "$OPENBAO_ADDR/v1/sys/auth/approle"
          policy=$(jq -nc --arg policy 'path "secret/data/confii-ci/*" { capabilities = ["create", "read", "update", "delete"] } path "secret/metadata/confii-ci" { capabilities = ["list"] } path "secret/metadata/confii-ci/*" { capabilities = ["read", "list", "delete"] }' '{policy: $policy}')
          call_bao --request PUT --data "$policy" \
            "$OPENBAO_ADDR/v1/sys/policies/acl/confii-ci"
          call_bao --request POST --data '{"token_policies":["confii-ci"],"token_ttl":"5m","token_max_ttl":"10m"}' \
            "$OPENBAO_ADDR/v1/auth/approle/role/confii-ci"

          role_id=$(call_bao "$OPENBAO_ADDR/v1/auth/approle/role/confii-ci/role-id" | jq -er '.data.role_id')
          secret_id=$(call_bao --request POST --data '{}' "$OPENBAO_ADDR/v1/auth/approle/role/confii-ci/secret-id" | jq -er '.data.secret_id')
          [[ "$role_id" =~ ^[[:alnum:]-]{16,128}$ ]]
          [[ "$secret_id" =~ ^[[:alnum:]-]{16,128}$ ]]
          echo "::add-mask::$role_id"
          echo "::add-mask::$secret_id"
          {
            echo "CONFII_OPENBAO_ADDR=$OPENBAO_ADDR"
            echo "CONFII_OPENBAO_TOKEN=$OPENBAO_TOKEN"
            echo "CONFII_OPENBAO_ROLE_ID=$role_id"
            echo "CONFII_OPENBAO_SECRET_ID=$secret_id"
          } >>"$GITHUB_ENV"

      - name: Exercise token and AppRole operations against OpenBao
        run: make test-openbao

  test-integration:
    name: Integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Integration tests
        run: go test -v -count=1 -timeout 120s ./integration/...

  fuzz:
    name: Fuzz (short)
    runs-on: ubuntu-latest

    # Runs each known fuzz target with a short fuzztime so PR feedback
    # stays fast. Longer fuzz campaigns can be scheduled in a separate
    # workflow that runs nightly. The matrix lists each fuzz target as
    # `<package>:<func>` so a failure points clearly at the offending
    # target. -run=^$ disables the seed-only unit tests for that
    # invocation; the seed corpus is still exercised because Go's fuzz
    # engine prepends f.Add seeds to the queue.
    # NOTE: -fuzz only accepts a single Go package, so each entry below
    # is the precise package path (no /...) for one fuzz target.
    strategy:
      fail-fast: false
      matrix:
        target:
          - "./loader:FuzzYAMLLoader"
          - "./loader:FuzzJSONLoader"
          - "./loader:FuzzTOMLLoader"
          - "./loader:FuzzEnvFileLoader"
          - "./loader:FuzzUnquoteEnvValue"
          - "./secret:FuzzResolverResolve"
          - "./hook:FuzzEnvExpanderHook"
          - "./internal/dictutil:FuzzGetNested"
          - "./internal/dictutil:FuzzSetNested"
          - "./internal/dictutil:FuzzDeepMerge"
          - "./internal/typecoerce:FuzzParseScalar"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Fuzz target
        run: |
          target='${{ matrix.target }}'
          pkg="${target%%:*}"
          fn="${target##*:}"
          echo "Fuzzing $fn in $pkg for 30s"
          go test -run='^$' -fuzz="^${fn}$" -fuzztime=30s -timeout=120s "$pkg"

  fuzz-introspector:
    name: Fuzz Introspector
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            tools/fuzz-introspector/package.txt
            tools/fuzz-introspector/requirements.txt

      - name: Install hash-locked Fuzz Introspector
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: \
            --require-hashes --requirement tools/fuzz-introspector/requirements.txt
          python -m pip install --disable-pip-version-check --only-binary=:all: \
            --no-deps --require-hashes --requirement tools/fuzz-introspector/package.txt

      - name: Generate and verify report
        run: make fuzz-introspector-report FUZZ_INTROSPECTOR="$(command -v fuzz-introspector)"

      - name: Upload report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-introspector-report
          path: bin/fuzz-introspector-report/
          if-no-files-found: error
          retention-days: 14

  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run tests with coverage
        run: go test -coverprofile=coverage.out -covermode=atomic -timeout 120s ./...

      - name: Run 32-bit root tests with coverage
        run: GOARCH=386 go test -coverprofile=coverage-386.out -covermode=atomic -timeout 120s .

      - name: Run cloud-provider tests with coverage
        run: sh scripts/test-cloud-consumer.sh "aws,azure,gcp,vault,ibm" coverage "$GITHUB_WORKSPACE/coverage-cloud.out"

      - name: Enforce 90% non-example statement coverage
        run: sh scripts/check-statement-coverage.sh coverage.out

      - name: Enforce 80% non-example branch coverage
        run: make test-branch-cover

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out,coverage-386.out,coverage-cloud.out

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: test -z "$(gofmt -s -l .)" || { gofmt -s -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Vet cloud packages as a consumer
        run: sh scripts/test-cloud-consumer.sh 'aws,azure,gcp,vault,ibm' vet

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.4

  module-integrity:
    name: Module integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Verify all module manifests
        run: sh scripts/verify-modules.sh

  license-compliance:
    name: License compliance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/reuse/requirements.txt

      - name: Verify REUSE 3.3 compliance
        run: make reuse-lint

  reproducible-build:
    name: Reproducible build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Verify reproducible CLI build
        run: sh scripts/check-reproducible-build.sh

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify every proposed commit is signed off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: sh scripts/check-dco.sh "$BASE_SHA" "$HEAD_SHA"

  api-compatibility:
    name: API compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository history and release tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Reject incompatible public API changes
        run: make api-compat

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: v8.30.1
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            if go install "github.com/zricethezav/gitleaks/v8@${GITLEAKS_VERSION}"; then
              exit 0
            fi

            if (( attempt == 3 )); then
              echo "::error::Gitleaks installation failed after ${attempt} attempts"
              exit 1
            fi

            delay=$((attempt * 10))
            echo "::warning::Gitleaks installation attempt ${attempt} failed; retrying in ${delay}s"
            sleep "${delay}"
          done

      - name: Scan release tree
        run: gitleaks dir . --redact --no-banner --exit-code 1

  supply-chain-metadata:
    name: Supply-chain metadata
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Verify VEX coverage and non-exploitability
        run: make supply-chain-check

  required:
    name: CI required
    if: always()
    needs:
      - build
      - test
      - test-cloud-tags
      - openbao-interop
      - test-integration
      - fuzz
      - fuzz-introspector
      - coverage
      - lint
      - module-integrity
      - license-compliance
      - reproducible-build
      - dependency-review
      - dco
      - api-compatibility
      - secret-scan
      - supply-chain-metadata
    runs-on: ubuntu-latest

    steps:
      - name: Verify required jobs
        shell: bash
        run: |
          set -euo pipefail
          test '${{ needs.build.result }}' = success
          test '${{ needs.test.result }}' = success
          test '${{ needs.test-cloud-tags.result }}' = success
          test '${{ needs.openbao-interop.result }}' = success
          test '${{ needs.test-integration.result }}' = success
          test '${{ needs.fuzz.result }}' = success
          test '${{ needs.fuzz-introspector.result }}' = success
          test '${{ needs.coverage.result }}' = success
          test '${{ needs.lint.result }}' = success
          test '${{ needs.module-integrity.result }}' = success
          test '${{ needs.license-compliance.result }}' = success
          test '${{ needs.reproducible-build.result }}' = success
          test '${{ needs.api-compatibility.result }}' = success
          test '${{ needs.secret-scan.result }}' = success
          test '${{ needs.supply-chain-metadata.result }}' = success

          # Dependency and DCO review must succeed on pull requests. They are
          # intentionally skipped only on the post-merge push to main.
          case '${{ github.event_name }}' in
            pull_request)
              test '${{ needs.dependency-review.result }}' = success
              test '${{ needs.dco.result }}' = success
              ;;
            push)
              test '${{ needs.dependency-review.result }}' = skipped
              test '${{ needs.dco.result }}' = skipped
              ;;
            *) exit 1 ;;
          esac
