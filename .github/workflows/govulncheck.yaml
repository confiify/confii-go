name: Govulncheck

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 3" # Wednesday 6am UTC

permissions:
  contents: read

jobs:
  govulncheck:
    name: Govulncheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            loader/cloud/go.sum
            secret/cloud/go.sum
            examples/cloud/go.sum

      - name: Install govulncheck
        # Immutable commit for golang/vuln v1.1.4.
        run: go install golang.org/x/vuln/cmd/govulncheck@d1f380186385b4f64e00313f31743df8e4b89a77

      - name: Scan core module
        run: govulncheck ./...

      - name: Scan cloud modules as a consumer
        run: sh scripts/test-cloud-consumer.sh 'aws,azure,gcp,vault,ibm' vuln

      - name: Set up Go for OSV-Scanner
        # OSV-Scanner v2.3.8 requires Go 1.26.2 or newer. Keep the project
        # reachability scans above on the repository-pinned toolchain.
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.2"
          cache: false

      - name: Install OSV-Scanner
        # Immutable commit for google/osv-scanner v2.3.8.
        run: go install github.com/google/osv-scanner/v2/cmd/osv-scanner@408fcd6f8707999a29e7ba45e15809764cf24f67

      - name: Scan dependency manifests and lockfiles
        # govulncheck above owns Go reachability analysis. Disable OSV's
        # duplicate call analysis because the nested modules intentionally
        # reference the not-yet-published release tag during release PRs.
        run: osv-scanner scan source --recursive --no-call-analysis=go .
