name: Docs

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "llms.txt"
      - "docs/**"
      - "mkdocs.yml"
      - "Makefile"
      - "scripts/check-docs-artifact.sh"
      - "scripts/check-onboarding-docs.sh"
      - "scripts/check-site-headers.sh"
  pull_request:
    paths:
      - "README.md"
      - "llms.txt"
      - "docs/**"
      - "mkdocs.yml"
      - "Makefile"
      - "scripts/check-docs-artifact.sh"
      - "scripts/check-onboarding-docs.sh"
      - "scripts/check-site-headers.sh"

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install MkDocs Material
        run: pip install --require-hashes --requirement docs/requirements.txt

      - name: Build and validate site
        run: make docs-check
