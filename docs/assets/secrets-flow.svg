<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Confii secret resolution flow</title>
  <desc id="desc">Secret placeholders are parsed by the resolver, read from the selected provider, materialized into the snapshot, and redacted in diagnostics.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,12 L12,6 z" fill="#334155"/></marker><style>.bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:16}.blue{fill:#eef2ff;stroke:#4f46e5;stroke-width:2;rx:10}.secret{fill:#fef2f2;stroke:#dc2626;stroke-width:2;rx:10}.green{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:10}.purple{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2;rx:10}.title{font:700 28px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.label{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.small{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#334155}.mono{font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#1e293b}.arrow{stroke:#334155;stroke-width:2.6;fill:none;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round}.note{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b}</style></defs>
  <rect class="bg" width="1200" height="560"/>
  <text class="title" x="40" y="54">Secret Resolution Flow</text>
  <rect class="panel" x="30" y="86" width="1140" height="405"/>

  <rect class="blue" x="70" y="145" width="235" height="86"/><text class="label" x="100" y="176">Config placeholder</text><text class="mono" x="100" y="199">${secret@vault:key}</text><text class="small" x="100" y="220">provider, key, field, version</text>
  <line class="arrow" x1="305" y1="188" x2="373" y2="188"/>
  <rect class="purple" x="395" y="145" width="200" height="86"/><text class="label" x="425" y="176">Resolver</text><text class="small" x="425" y="199">parse and dedupe</text><text class="small" x="425" y="220">apply cache policy</text>
  <line class="arrow" x1="595" y1="188" x2="663" y2="188"/>
  <rect class="secret" x="685" y="120" width="190" height="60"/><text class="label" x="730" y="154">Vault</text>
  <rect class="secret" x="685" y="198" width="190" height="60"/><text class="label" x="722" y="232">Cloud stores</text>
  <path class="arrow" d="M875 150 L915 150 L915 188 L963 188"/>
  <path class="arrow" d="M875 228 L915 228 L915 188 L963 188"/>
  <rect class="green" x="985" y="145" width="150" height="86"/><text class="label" x="1018" y="176">Snapshot</text><text class="small" x="1018" y="199">effective value</text>

  <path class="arrow" d="M1060 231 L1060 295 L205 295 L205 330"/>
  <rect class="purple" x="70" y="330" width="270" height="78"/><text class="label" x="100" y="362">Sensitive paths</text><text class="small" x="100" y="384">redact diagnostics and diffs</text>
  <line class="arrow" x1="340" y1="369" x2="408" y2="369"/>
  <rect class="purple" x="430" y="330" width="270" height="78"/><text class="label" x="460" y="362">Cache and refresh</text><text class="small" x="460" y="384">controlled provider traffic</text>
  <line class="arrow" x1="700" y1="369" x2="768" y2="369"/>
  <rect class="green" x="790" y="330" width="270" height="78"/><text class="label" x="820" y="362">Safe introspection</text><text class="small" x="820" y="384">sources shown, values withheld</text>
  <text class="note" x="70" y="455">Only effective selected-environment references are resolved.</text>
</svg>
