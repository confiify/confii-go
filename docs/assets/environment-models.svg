<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Confii environment models</title>
  <desc id="desc">Named files and sectioned files both resolve defaults plus the selected environment into one effective configuration.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,12 L12,6 z" fill="#334155"/></marker><style>.bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:16}.blue{fill:#eef2ff;stroke:#4f46e5;stroke-width:2;rx:10}.green{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:10}.orange{fill:#fff7ed;stroke:#ea580c;stroke-width:2;rx:10}.title{font:700 28px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.head{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.label{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.small{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#334155}.mono{font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#1e293b}.arrow{stroke:#334155;stroke-width:2.6;fill:none;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round}</style></defs>
  <rect class="bg" width="1200" height="560"/>
  <text class="title" x="40" y="54">Environment Resolution Models</text>

  <rect class="panel" x="40" y="92" width="535" height="390"/>
  <text class="head" x="70" y="132">Named files</text>
  <rect class="blue" x="80" y="170" width="180" height="76"/><text class="label" x="110" y="202">Default file</text><text class="mono" x="110" y="224">default.yaml</text>
  <line class="arrow" x1="260" y1="208" x2="328" y2="208"/>
  <rect class="blue" x="350" y="170" width="180" height="76"/><text class="label" x="382" y="202">Env file</text><text class="mono" x="382" y="224">production.yaml</text>
  <path class="arrow" d="M440 246 L440 292 L305 292 L305 330"/>
  <rect class="green" x="180" y="330" width="250" height="78"/><text class="label" x="224" y="362">Resolved config</text><text class="small" x="224" y="384">env overrides defaults</text>
  <text class="small" x="80" y="444">Configured by an environment_files source.</text>

  <rect class="panel" x="625" y="92" width="535" height="390"/>
  <text class="head" x="655" y="132">Sectioned file</text>
  <rect class="orange" x="665" y="170" width="190" height="96"/><text class="label" x="695" y="202">One file</text><text class="mono" x="695" y="224">default:</text><text class="mono" x="695" y="246">production:</text>
  <line class="arrow" x1="855" y1="218" x2="923" y2="218"/>
  <rect class="orange" x="945" y="170" width="170" height="96"/><text class="label" x="975" y="202">Select env</text><text class="small" x="975" y="224">production</text>
  <path class="arrow" d="M1030 266 L1030 312 L895 312 L895 350"/>
  <rect class="green" x="770" y="350" width="250" height="78"/><text class="label" x="814" y="382">Resolved config</text><text class="small" x="814" y="404">default + selected section</text>
  <text class="small" x="655" y="444">Use hybrid only for controlled migrations.</text>
</svg>
