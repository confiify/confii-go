<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Confii runtime lifecycle</title>
  <desc id="desc">Runtime operations prepare private candidates, validate them, then either publish atomically or discard them on failure.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,12 L12,6 z" fill="#334155"/></marker><style>.bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:16}.blue{fill:#eef2ff;stroke:#4f46e5;stroke-width:2;rx:10}.green{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:10}.orange{fill:#fff7ed;stroke:#ea580c;stroke-width:2;rx:10}.red{fill:#fef2f2;stroke:#dc2626;stroke-width:2;rx:10}.title{font:700 28px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.label{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.small{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#334155}.arrow{stroke:#334155;stroke-width:2.6;fill:none;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round}.note{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b}</style></defs>
  <rect class="bg" width="1200" height="520"/>
  <text class="title" x="40" y="54">Runtime Lifecycle and Atomic Publication</text>
  <rect class="panel" x="30" y="86" width="1140" height="390"/>

  <rect class="blue" x="70" y="140" width="220" height="78"/><text class="label" x="100" y="172">Runtime operation</text><text class="small" x="100" y="194">Reload, Extend, Set, Override</text>
  <line class="arrow" x1="290" y1="179" x2="358" y2="179"/>
  <rect class="orange" x="380" y="140" width="220" height="78"/><text class="label" x="410" y="172">Private candidate</text><text class="small" x="410" y="194">load, merge, materialize</text>
  <line class="arrow" x1="600" y1="179" x2="668" y2="179"/>
  <rect class="orange" x="690" y="140" width="220" height="78"/><text class="label" x="720" y="172">Validate candidate</text><text class="small" x="720" y="194">schema, typed, custom</text>
  <line class="arrow" x1="910" y1="179" x2="978" y2="179"/>
  <rect class="green" x="1000" y="140" width="130" height="78"/><text class="label" x="1034" y="172">Publish</text><text class="small" x="1034" y="194">short lock</text>

  <path class="arrow" d="M800 218 L800 270 L615 270 L615 312"/>
  <rect class="red" x="465" y="312" width="300" height="78"/><text class="label" x="495" y="344">Failure path</text><text class="small" x="495" y="366">discard candidate; keep old snapshot</text>

  <path class="arrow" d="M1065 218 L1065 270 L930 270 L930 312"/>
  <rect class="green" x="800" y="312" width="260" height="78"/><text class="label" x="830" y="344">Readers</text><text class="small" x="830" y="366">see complete snapshots only</text>

  <rect class="blue" x="70" y="312" width="260" height="78"/><text class="label" x="100" y="344">Override stack</text><text class="small" x="100" y="366">temporary layers; idempotent restore</text>
  <text class="note" x="70" y="430">Runtime work happens outside the published snapshot until every required step succeeds.</text>
</svg>
