<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Confii composition and merge flow</title>
  <desc id="desc">Raw sources are composed first, then the composed layer enters the ordered merge stack with lower and higher precedence layers.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,12 L12,6 z" fill="#334155"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}
      .panel{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:16}
      .source{fill:#eef2ff;stroke:#4f46e5;stroke-width:2;rx:10}
      .process{fill:#fff7ed;stroke:#ea580c;stroke-width:2;rx:10}
      .result{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:10}
      .title{font:700 28px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
      .label{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
      .small{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#334155}
      .mono{font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#1e293b}
      .arrow{stroke:#334155;stroke-width:2.6;fill:none;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round}
      .note{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b}
    </style>
  </defs>

  <rect class="bg" width="1200" height="520"/>
  <text class="title" x="40" y="54">Composition Then Merge</text>
  <rect class="panel" x="30" y="86" width="1140" height="390"/>

  <!-- Top row: composition of one raw source into one normalized layer. -->
  <rect class="source" x="90" y="140" width="220" height="86"/>
  <text class="label" x="120" y="173">Raw source</text>
  <text class="mono" x="120" y="196">_include</text>
  <text class="mono" x="120" y="217">_defaults</text>

  <line class="arrow" x1="310" y1="183" x2="398" y2="183"/>

  <rect class="process" x="420" y="140" width="230" height="86"/>
  <text class="label" x="450" y="173">Composition pass</text>
  <text class="small" x="450" y="196">resolve includes</text>
  <text class="small" x="450" y="217">apply defaults</text>

  <line class="arrow" x1="650" y1="183" x2="738" y2="183"/>

  <rect class="result" x="760" y="140" width="250" height="86"/>
  <text class="label" x="790" y="173">Composed layer</text>
  <text class="small" x="790" y="196">directive keys removed</text>
  <text class="small" x="790" y="217">dependencies tracked</text>

  <!-- Clean vertical transition into the merge stack. -->
  <path class="arrow" d="M885 226 L885 262 L200 262 L200 300"/>
  <text class="note" x="430" y="252">composed output enters the ordered source stack</text>

  <!-- Bottom row: ordered layer precedence. -->
  <rect class="source" x="90" y="300" width="220" height="78"/>
  <text class="label" x="120" y="332">Layer 1</text>
  <text class="small" x="120" y="354">lower precedence</text>

  <line class="arrow" x1="310" y1="339" x2="398" y2="339"/>

  <rect class="source" x="420" y="300" width="230" height="78"/>
  <text class="label" x="450" y="332">Layer 2</text>
  <text class="small" x="450" y="354">higher precedence</text>

  <line class="arrow" x1="650" y1="339" x2="738" y2="339"/>

  <rect class="result" x="760" y="300" width="250" height="78"/>
  <text class="label" x="790" y="332">Merged config</text>
  <text class="small" x="790" y="354">per-path strategies</text>

  <text class="note" x="90" y="425">Later layers override or combine duplicate keys according to the configured merge strategy.</text>
</svg>
