<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Confii configuration startup flow</title>
  <desc id="desc">Confii resolves self-config, loads sources, composes, merges, applies environment selection, materializes secrets and hooks, validates, and publishes a typed snapshot.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,12 L12,6 z" fill="#334155"/></marker>
    <style>.bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:16}.blue{fill:#eef2ff;stroke:#4f46e5;stroke-width:2;rx:10}.green{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:10}.orange{fill:#fff7ed;stroke:#ea580c;stroke-width:2;rx:10}.purple{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2;rx:10}.title{font:700 28px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.label{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.small{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#334155}.arrow{stroke:#334155;stroke-width:2.6;fill:none;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round}.note{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b}</style>
  </defs>
  <rect class="bg" width="1200" height="560"/>
  <text class="title" x="40" y="54">Configuration Startup Flow</text>
  <rect class="panel" x="30" y="86" width="1140" height="420"/>

  <rect class="blue" x="70" y="135" width="190" height="74"/><text class="label" x="98" y="166">Constructor</text><text class="small" x="98" y="188">New / NewWithContext</text>
  <line class="arrow" x1="260" y1="172" x2="328" y2="172"/>
  <rect class="green" x="350" y="135" width="200" height="74"/><text class="label" x="380" y="166">Self-config</text><text class="small" x="380" y="188">base + overlay</text>
  <line class="arrow" x1="550" y1="172" x2="618" y2="172"/>
  <rect class="green" x="640" y="135" width="200" height="74"/><text class="label" x="670" y="166">Options resolved</text><text class="small" x="670" y="188">env, sources, providers</text>
  <line class="arrow" x1="840" y1="172" x2="908" y2="172"/>
  <rect class="orange" x="930" y="135" width="190" height="74"/><text class="label" x="970" y="166">Loaders</text><text class="small" x="970" y="188">files, env, cloud</text>

  <path class="arrow" d="M1025 209 L1025 248 L165 248 L165 286"/>

  <rect class="orange" x="70" y="286" width="190" height="74"/><text class="label" x="112" y="317">Compose</text><text class="small" x="112" y="339">includes/defaults</text>
  <line class="arrow" x1="260" y1="323" x2="328" y2="323"/>
  <rect class="orange" x="350" y="286" width="190" height="74"/><text class="label" x="402" y="317">Merge</text><text class="small" x="402" y="339">source precedence</text>
  <line class="arrow" x1="540" y1="323" x2="608" y2="323"/>
  <rect class="blue" x="630" y="286" width="190" height="74"/><text class="label" x="670" y="317">Environment</text><text class="small" x="670" y="339">named or sectioned</text>
  <line class="arrow" x1="820" y1="323" x2="888" y2="323"/>
  <rect class="purple" x="910" y="286" width="210" height="74"/><text class="label" x="952" y="317">Materialize</text><text class="small" x="952" y="339">secrets and hooks</text>

  <path class="arrow" d="M1015 360 L1015 399 L445 399 L445 432"/>

  <rect class="purple" x="330" y="432" width="230" height="58"/><text class="label" x="390" y="466">Validate</text>
  <line class="arrow" x1="560" y1="461" x2="628" y2="461"/>
  <rect class="green" x="650" y="432" width="260" height="58"/><text class="label" x="708" y="466">Publish Config[T]</text>

  <text class="note" x="930" y="452">Reads use the published snapshot.</text>
  <text class="note" x="930" y="474">No partial candidate is visible.</text>
</svg>
