default_environment: development
environment_strategy: named_files

sources:
  - type: environment_files
    search_paths: [config]
    default_file: default.yaml
    environment_file: "{environment}.yaml"
    default_required: true
    environment_required: true

secrets:
  default_provider: development
  environment_defaults:
    production: production

  providers:
    development:
      type: dict
      entries:
        database-password: local-example-password

    production:
      type: dict
      entries:
        database-password: production-example-password

    shared:
      type: dict
      entries:
        signing-key: shared-example-signing-key
